   <section id="photography" style="padding-top:1rem;">
      <div class="container">
         <div class="gallery-grid">
            <figure class="gallery-item reveal" data-modal
               data-img="images/portfolio/photography/modals/sleepy.jpg" data-title="Cat posing for a picture"
               data-desc="Finally got her to pose. For a standard fee of course. Wink!">
               <img src="images/portfolio/photography/sleepy.png" alt="Cat posing for a picture" loading="lazy">
               <figcaption>My cat posing for a pic</figcaption>
            </figure>

            <figure class="gallery-item reveal" data-modal style="--d:.08s"
               data-img="images/portfolio/photography/modals/shore.jpg" data-title="Nature's gift"
               data-desc="A shore in the Lagos beach area.">
               <img src="images/portfolio/photography/shore.png" alt="A shore" loading="lazy">
               <figcaption>Shore</figcaption>
            </figure>

            <figure class="gallery-item reveal" data-modal style="--d:.16s"
               data-img="images/portfolio/photography/modals/big molly.jpg" data-title="Big Molly"
               data-desc="One of the most exquisite cats I have ever seen. A king.">
               <img src="images/portfolio/photography/big-molly-face.png" alt="Big cat face" loading="lazy">
               <figcaption>Cat face</figcaption>
            </figure>

            <figure class="gallery-item reveal" data-modal
               data-img="images/portfolio/photography/modals/sleepy-side-face.jpg" data-title="&quot;Darkness my old friend&quot;"
               data-desc="Just a cat basking in the glow of the dark.">
               <img src="images/portfolio/photography/sleepy-side-shadow.png" alt="A shadow cat" loading="lazy">
               <figcaption>The shadow</figcaption>
            </figure>

            <figure class="gallery-item reveal" data-modal style="--d:.08s"
               data-img="images/portfolio/photography/modals/shore2.jpg" data-title="A shore"
               data-desc="Nature is really beyond us.">
               <img src="images/portfolio/photography/shore(2).png" alt="Another shore" loading="lazy">
               <figcaption>Nature</figcaption>
            </figure>

            <figure class="gallery-item reveal" data-modal style="--d:.16s"
               data-img="images/portfolio/photography/modals/abby.jpg" data-title="Made in Abbys"
               data-desc="A cat simply being a cat.">
               <img src="images/portfolio/photography/abby.png" alt="Abby cat" loading="lazy">
               <figcaption>Abby</figcaption>
            </figure>
